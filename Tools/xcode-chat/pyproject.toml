[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xcode-chat"
version = "0.1.0"
description = "Send a prompt to an Xcode coding-assistant chat from the terminal and record it in Xcode's chat store"
requires-python = ">=3.9"

[project.scripts]
xcode-chat = "xcode_chat.cli:main"

[tool.setuptools]
packages = ["xcode_chat", "xcode_chat.providers"]
